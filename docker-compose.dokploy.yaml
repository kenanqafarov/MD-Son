# Full stack for Dokploy (Compose service, branch "backend", compose path ./docker-compose.dokploy.yaml).
# Required env in Dokploy: JWT_SECRET, DB_PASSWORD. Optional: APP_PORT, FRONTEND_GIT.
# Open the app at http://<server-ip>:${APP_PORT}.
services:
  postgres-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: modern_dentistry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modern_dentistry"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-server:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --stop-writes-on-bgsave-error no

  modern-dentistry:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # nginx serves frontend and API from one origin, so CORS only matters for direct API access
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - media:/app/media

  frontend:
    build:
      # Public repo, so Docker can build straight from the frontend branch
      context: ${FRONTEND_GIT:-https://github.com/kenanqafarov/MD-Son.git#frontend}
    restart: unless-stopped
    depends_on:
      - modern-dentistry
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - media:/app/media:ro

volumes:
  pgdata:
  media:
