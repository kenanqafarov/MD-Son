spring:
  profiles:
    active: dev
  application:
    name: modern-dentistry
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 6000000 # 100 minutes
      refresh-token:
        expiration: 604800000 # 7 days
  jpa:
    hibernate:
      ddl-auto: none # When you launch the application for the first time - switch "none" at "create"
    show-sql: true
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    #  mail:
    #    host: smtp.gmail.com
    #    port: 587
    #    username: ${MAIL_USERNAME}
    #    password: ${MAIL_PASSWORD}
    #    properties:
    #      mail:
    #        smtp:
    #          auth: true
    #          starttls:
    #            enable: true

app:
  upload:
    dir: ./media/worker/profile

server:
  port: 5555
  address: 0.0.0.0

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://169.58.138.247}
